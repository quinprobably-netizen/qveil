[package]
name = "veil"
version = "0.2.0"
edition = "2024"
rust-version = "1.89"
description = "The engine behind veil, a private, account-free YouTube app (prototype)"
license = "MIT"
publish = false

[[bin]]
name = "veil-core"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
jiff = "0.2"
rand = "0.9"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls", "socks"] }
roxmltree = "0.20"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
url = "2"

[profile.release]
lto = "thin"
strip = true
