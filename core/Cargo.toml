[package]
name = "qveil"
version = "0.4.0"
edition = "2024"
rust-version = "1.89"
description = "The engine behind qveil, a private, account-free YouTube app (prototype)"
license = "MIT"
publish = false

[[bin]]
name = "qveil-core"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
jiff = "0.2"
libc = "0.2"
rand = "0.9"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "http2", "rustls-tls", "socks"] }
roxmltree = "0.20"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
url = "2"

[dev-dependencies]
# A stand-in for googlevideo over HTTP/2, in the tests (see `h2up`).
bytes = "1"
h2 = "0.4"
http = "1"
tokio = { version = "1", features = ["net", "rt", "time"] }

[profile.release]
lto = "thin"
strip = true
