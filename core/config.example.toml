# qveil config: copy to ~/.config/qveil/config.toml
# Every key is optional; these are the defaults unless noted.
# A key this version doesn't have (a newer qveil's setting) is left out, and
# the window says which. One a letter or two off a setting, like `prxoy`, is
# taken for a typo: qveil doesn't start until it is corrected.

# Route ALL traffic (search, feeds, metadata and the video bytes) through a proxy.
# http://, https:// or socks5h:// (plain socks5:// is refused because it leaks DNS).
# proxy = "socks5h://127.0.0.1:9050"

# With a SOCKS proxy, use new random credentials for each request so Tor puts
# each channel feed and each video on its own circuit. qveil can't tell Tor from
# another SOCKS proxy by its address, so this is always on for every SOCKS proxy:
# setting it to false there is refused. The key is still read, so old config
# files keep loading. A SOCKS proxy URL with its own credentials
# (socks5h://user:password@host:port) is used as given, with every request
# sharing them, and qveil then says the route is not isolated.
isolate_circuits = true

max_height = 1080

# Keep a local watch history. Nothing ever leaves this machine either way.
history = false

# For how many days qveil remembers where you stopped in an unfinished video,
# in a file only you can read. A finished video is forgotten at once. 0 turns
# this off and deletes what was remembered.
resume_days = 7

# Topic feeds: qveil works out what the channels you follow are about from the
# titles they uploaded lately, and searches YouTube by itself for more of the
# same, at most twelve searches a day. That tells YouTube what your channels
# are about, so it is off until you turn it on.
topic_feeds = false

# Get the next video ready: in the last 30 seconds of a video played from a
# list, look up the next one in it, so that it starts at once. YouTube sees
# that lookup even if you never watch the video, so it is off until you turn
# it on.
prepare_next = false

# Show thumbnails. They are fetched through the same route as everything else.
# With Tor isolation each one gets its own circuit, so separate requests can't
# be linked by IP address. A refresh is still a burst of requests for exactly
# the videos your channels uploaded, though, so timing and the set of IDs can
# still tie them together.
thumbnails = true

# Keep the thumbnails that were fetched on disk (in ~/.cache/qveil/thumbs, at
# most 64 MiB, the least recently shown going first), so that they aren't
# fetched again. They are a record of the pictures you were shown, so it is
# off until you turn it on; turning it off deletes them.
keep_thumbnails = false

# Channel feeds fetched at once.
feed_workers = 4

ytdlp = "yt-dlp"
mpv = "mpv"
mpv_args = []
