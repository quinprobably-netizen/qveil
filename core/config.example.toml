# qveil config: copy to ~/.config/qveil/config.toml
# Every key is optional; these are the defaults unless noted.

# Route ALL traffic (search, feeds, metadata and the video bytes) through a proxy.
# http://, https:// or socks5h:// (plain socks5:// is refused because it leaks DNS).
# proxy = "socks5h://127.0.0.1:9050"

# With a SOCKS proxy, use new random credentials for each request so Tor puts
# each channel feed and each video on its own circuit. With Tor this is always
# on: setting it to false there is refused. It is still read, so old config
# files keep working, and it only matters for a SOCKS proxy that isn't Tor.
isolate_circuits = true

max_height = 1080

# Keep a local watch history. Nothing ever leaves this machine either way.
history = false

# Show thumbnails. They are fetched through the same route as everything else.
# With Tor isolation each one gets its own circuit, so separate requests can't
# be linked by IP address. A refresh is still a burst of requests for exactly
# the videos your channels uploaded, though, so timing and the set of IDs can
# still tie them together.
thumbnails = true

# Channel feeds fetched at once.
feed_workers = 4

ytdlp = "yt-dlp"
mpv = "mpv"
mpv_args = []
